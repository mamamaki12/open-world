name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Check mobile and desktop controls
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/open-world-vite.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-vehicle-walls.mjs
          node scripts/check-double-tap-jump.mjs
          node scripts/check-driving-assists.mjs
          node scripts/check-aim-controls.mjs
          node scripts/check-fashion.mjs
          node scripts/check-looks.mjs
          node scripts/check-furniture-lighting.mjs
          node scripts/check-jobs.mjs pc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-checks
          path: |
            control-checks/
            fashion-checks/
            looks-checks/
            job-checks/
          if-no-files-found: ignore

  building-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare desktop geometry and verify detail switching
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/open-world-lod-vite.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-building-detail.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: building-detail-checks
          path: building-detail-checks/
          if-no-files-found: ignore

  world-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the bundled relay is up to date
        run: npm run build:server && git diff --exit-code server/dist
      - run: node --test server/relay.test.mjs
      - run: node scripts/check-lighting-relay.mjs
      - name: Check deployed relay over HTTPS and WSS
        run: node scripts/check-public-relay.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check two-player sessions and production offline launch
        run: |
          node server/dist/relay.mjs > /tmp/world-relay.log 2>&1 &
          relay=$!
          npm run dev -- --host 127.0.0.1 > /tmp/world-vite.log 2>&1 &
          web=$!
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/world-preview.log 2>&1 &
          preview=$!
          trap 'kill "$relay" "$web" "$preview"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null && curl -fsS http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-world-session.mjs
          node scripts/check-shared-doors.mjs
          node scripts/check-shared-wallet.mjs
          node scripts/check-town-shops.mjs
          node scripts/check-world-offline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-session-checks
          path: world-session-checks/
          if-no-files-found: ignore

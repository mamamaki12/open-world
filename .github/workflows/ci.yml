name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Check storefronts and vehicle flow in Chromium
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/open-world-vite.log 2>&1 &
          node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: browser-checks
          if-no-files-found: ignore

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/wait-condition.test.mjs
      - run: npm run build
      - name: Install browser for interaction checks
        run: npx playwright install --with-deps chromium
      - name: Check mobile and desktop controls
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/open-world-vite.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-vehicle-walls.mjs
          node scripts/check-double-tap-jump.mjs
          node scripts/check-driving-assists.mjs
          node scripts/check-aim-controls.mjs
          node scripts/check-fashion.mjs
          node scripts/check-looks.mjs
          node scripts/check-jobs.mjs pc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-checks
          path: |
            control-checks/
            fashion-checks/
            looks-checks/
            job-checks/
          if-no-files-found: ignore

  vehicle-occupants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check occupants, stable vehicle geometry and actual entry/exit
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vehicle-occupants-vite.log 2>&1 &
          web=$!
          trap 'kill "$web"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-vehicle-occupants.mjs
          node scripts/check-vehicle-occupant-sync.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-occupants-checks
          path: browser-checks/vehicle-occupants/
          if-no-files-found: ignore

  construction-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check launcher layout, view controls, deletion and floor extension
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/bulk-selection-vite.log 2>&1 &
          web=$!
          trap 'kill "$web"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-launcher-layout.mjs
          node scripts/check-build-menu-layout.mjs
          node scripts/check-build-controls.mjs
          node scripts/check-connected-floors.mjs
          node scripts/check-shared-floor-extension.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: construction-ui-checks
          path: |
            browser-checks/build-controls/
            browser-checks/build-menu/
            browser-checks/launcher-layout/
            browser-checks/connected-floors/
            browser-checks/shared-floor/
          if-no-files-found: ignore

  large-text:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check overlapping UI when text is enlarged (page zoom 150-200%)
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/large-text-vite.log 2>&1 &
          web=$!
          trap 'kill "$web"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-large-text.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: large-text-checks
          path: browser-checks/large-text/
          if-no-files-found: ignore

  handheld-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check pocket console UI and unobstructed driving views
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/handheld-ui-vite.log 2>&1 &
          web=$!
          trap 'kill "$web"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-handheld-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handheld-ui-checks
          path: browser-checks/handheld-ui/
          if-no-files-found: ignore

  shared-editing-target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify two owners and the blue preview on the correct property
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/shared-target-vite.log 2>&1 &
          web=$!
          trap 'kill "$web"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-shared-editing-target.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-editing-target-checks
          path: browser-checks/shared-target/
          if-no-files-found: ignore

  shared-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Play shared world in desktop and phone browsers
        env:
          QA_PORT: 5173
          WORLD_TEST_URL: http://127.0.0.1:5173/
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/shared-ui-vite.log 2>&1 &
          web=$!
          trap 'kill "$web"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-shared-ui-layout.mjs
          node scripts/check-shared-takeover.mjs
          node scripts/check-appearance-onboarding.mjs
          node scripts/check-lot-builders.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-ui-checks
          path: browser-checks/shared-ui/
          if-no-files-found: ignore

  furniture-lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check desktop and phone lighting placement and rendering
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/furniture-lighting-vite.log 2>&1 &
          web=$!
          trap 'kill "$web"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-furniture-lighting.mjs
          node scripts/check-interior-lighting.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: furniture-lighting-checks
          path: |
            browser-checks/furniture-lighting-*.png
            browser-checks/interior-lighting/
          if-no-files-found: ignore

  building-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare desktop geometry and verify detail switching
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/open-world-lod-vite.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-building-detail.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: building-detail-checks
          path: building-detail-checks/
          if-no-files-found: ignore

  world-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the bundled relay is up to date
        run: npm run build:server && git diff --exit-code server/dist
      - run: node --test server/relay.test.mjs
      - run: node scripts/check-lighting-relay.mjs
      - name: Check deployed relay over HTTPS and WSS
        run: node scripts/check-public-relay.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check two-player sessions and production offline launch
        run: |
          node server/dist/relay.mjs > /tmp/world-relay.log 2>&1 &
          relay=$!
          npm run dev -- --host 127.0.0.1 > /tmp/world-vite.log 2>&1 &
          web=$!
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/world-preview.log 2>&1 &
          preview=$!
          trap 'kill "$relay" "$web" "$preview"' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null && curl -fsS http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-app-version.mjs
          node scripts/check-offline-update.mjs
          node scripts/check-world-session.mjs
          node scripts/check-shared-doors.mjs
          node scripts/check-shared-wallet.mjs
          node scripts/check-gameplay-regressions.mjs
          node scripts/check-recovery-regressions.mjs
          node scripts/check-shared-readiness.mjs
          node scripts/check-town-shops.mjs
          node scripts/check-world-offline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-session-checks
          path: world-session-checks/
          if-no-files-found: ignore

name: Deploy to GitHub Pages

# main に入った変更を公開サイトに出す。
# 初回だけ Settings → Pages → Source を「GitHub Actions」にしておく必要がある。
# Pages を有効にするまでは、ジョブは失敗せずにスキップされる。
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Merge after CI]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.has_pages && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # バージョン番号の PATCH を数えるのに履歴が要る（docs/versioning.md）。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Recover the orphaned deployment reported by Pages on 2026-10-15.
      # This targets only that old version; later deployments are never cancelled.
      - name: Clear orphaned Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                ...context.repo,
                pages_deployment_id: 'c06825dc1a9d2aa8a18ac765efc4abb64dd5bf9f'
              });
              core.info('Cancelled the orphaned Pages deployment.');
              await new Promise(resolve => setTimeout(resolve, 10000));
            } catch (error) {
              if (![400, 404, 409, 422].includes(error.status)) throw error;
              core.info('Old deployment cannot be cancelled: ' + error.message);
            }
      - id: deployment
        uses: actions/deploy-pages@v4
